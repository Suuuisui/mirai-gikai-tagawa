# MissionControl クラウド executor:
# GAS triage が起票する @claude メンション Issue を受けて、クラウド上で
# 実装 → PR 作成 → テスト → 自動マージまで行う。
# Claude 自身が PR を作れない場合も、push されたブランチからワークフローが PR を作成する。
# 必要な Secret: CLAUDE_CODE_OAUTH_TOKEN（claude setup-token で発行。Max サブスクの枠で動く）
name: Claude Cloud Executor
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# 既定は読み取りのみ。書き込みが要るジョブだけ個別に権限を足す。
permissions:
  contents: read

jobs:
  # 1) Claude に実装させ、対象 PR を特定する（書き込み権限あり。PR のコードは実行しない）
  claude:
    # 同じ Issue に対する実行を直列化（並行実行で片方のロック解除がもう片方の保護を外さないように）
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    # このリポジトリは PUBLIC。リポジトリ関係者（OWNER/MEMBER/COLLABORATOR）が書いた
    # Issue / コメントだけを処理する。コメント起動の場合は Issue 本文の作者も同条件
    # （第三者が書いた Issue 本文がプロンプトに入るのを防ぐ）。
    if: |
      (github.event_name == 'issues'
        && contains(github.event.issue.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    outputs:
      pr: ${{ steps.findpr.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Claude は Issue のスレッド全体を読む。関係者以外（第三者）のコメントが 1 件でもあれば、
      # プロンプトインジェクションで自動マージ→本番デプロイまで進む恐れがあるので起動しない（ジョブを失敗で止める）。
      # 確認から Claude 実行までの間に第三者が書き込めないよう、先に会話をロック（関係者だけ書ける状態）にする。
      # 最後の「ロック解除」ステップで元に戻す。
      - name: Issue の会話をロック
        id: lock
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          # すでにロックされていた Issue は、このジョブでは解除しない（was_locked=true）
          echo "was_locked=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUM}" --jq .locked)" >> "$GITHUB_OUTPUT"
          gh issue lock "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" || true
          # ロックできていなければ止める（すでにロック済みなら OK）
          [ "$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUM}" --jq .locked)" = "true" ] || { echo "::error::Issue をロックできませんでした"; exit 1; }

      - name: スレッドに関係者以外の書き込みが無いか確認
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          # 許可するのは関係者（OWNER/MEMBER/COLLABORATOR）と、名前を指定した信頼できるボットだけ
          BAD=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUM}/comments" --paginate \
            --jq '.[] | select(.user.login as $u | ["github-actions[bot]","claude[bot]"] | index($u) | not)
                      | select(.author_association as $a | ["OWNER","MEMBER","COLLABORATOR"] | index($a) | not)
                      | .user.login' | sort -u)
          if [ -n "$BAD" ]; then
            echo "::error::関係者以外のコメントがあるため @claude を実行しません: $(echo $BAD | tr '\n' ' ')"
            exit 1
          fi

      - name: Claude Code 実行
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(pnpm:*),Bash(python3:*),Bash(pip:*),Bash(pip3:*),Bash(pytest:*)"

      - name: PR を検出（無ければ Claude のブランチから作成）
        id: findpr
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # 対象は「この Issue 用の claude/issue-<番号>- ブランチ」「同一リポジトリ」
          # 「作成者が Suuuisui か github-actions / claude のボット」の PR だけ。
          PR=$(gh pr list --state open --json number,headRefName,isCrossRepository,author \
            --jq "first(.[] | select(
              (.headRefName | startswith(\"claude/issue-${ISSUE_NUM}-\"))
              and (.isCrossRepository == false)
              and ((.author.login) as \$a | [\"Suuuisui\",\"github-actions\",\"app/github-actions\",\"claude\",\"app/claude\",\"claude[bot]\",\"github-actions[bot]\"] | index(\$a))
            ).number)" || true)
          if [ -z "$PR" ]; then
            BR=$(gh api "repos/${GITHUB_REPOSITORY}/branches" --paginate \
              --jq "[.[].name | select(startswith(\"claude/issue-${ISSUE_NUM}-\"))] | last // empty")
            if [ -n "$BR" ]; then
              gh pr create --head "$BR" --title "$ISSUE_TITLE" \
                --body "Closes #${ISSUE_NUM} — MissionControl 自動生成 PR"
              PR=$(gh pr list --state open --head "$BR" --json number --jq '.[0].number')
            fi
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Issue の会話のロック解除
        if: always() && steps.lock.outputs.was_locked == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: gh issue unlock "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" || true

  # 2) PR のコードを install / test する。書き込み権限なし・トークンを残さない
  verify:
    needs: claude
    if: needs.claude.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PR_NUM: ${{ needs.claude.outputs.pr }}
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.claude.outputs.pr }}/head
          persist-credentials: false

      - name: 検証する commit を記録
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: テスト（lint / typecheck / build:ci / test）
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run typecheck
          pnpm run build:ci
          pnpm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy-for-build-check

  # 3) テスト合格後にだけマージしてデプロイ起動（コードは checkout / 実行しない）
  merge:
    needs: [claude, verify]
    if: needs.claude.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: 自動マージ
        # テストした commit から PR が動いていたらマージしない
        run: gh pr merge "${{ needs.claude.outputs.pr }}" --squash --delete-branch --match-head-commit "${{ needs.verify.outputs.sha }}" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: デプロイを起動（deploy.yml）
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
