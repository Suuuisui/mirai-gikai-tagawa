packages:
  - "packages/*"
  - "admin"
  - "web"
  - "worker"

minimumReleaseAge: 4320

# 2026-10-15 セキュリティ監査対応: 推移依存の脆弱性を修正版へ引き上げる
# （pnpm audit --prod で Critical/High が残らないことを確認済み）
overrides:
  protobufjs: ^7.6.5
  "@grpc/grpc-js": ^1.14.5
  "@opentelemetry/sdk-node": ^0.217.0
  "@opentelemetry/exporter-prometheus": ^0.217.0
  "@opentelemetry/propagator-jaeger": ^2.9.0
  hono: ^4.12.34
  fast-uri: ^3.1.8
  ip-address: ^10.7.1
  proxy-addr: ^2.0.8
  lodash-es: ^4.18.0
  ws: ^8.21.0
  postcss: ^8.5.23
  nanoid@<4: ^3.3.18
  nanoid@>=5: ^5.1.16
  source-map-js: ^1.2.2
  sharp: ^0.35.5
  "@modelcontextprotocol/sdk": ^1.31.0

# 2026-10-22 セキュリティ点検: 同じメジャー版の中の修正版へ引き上げる（pnpm audit の Moderate 以上）
# 本番で動く経路: AI チャットの表示（streamdown → mermaid → dompurify）、
#   コードの色付け（react-syntax-highlighter → refractor → prismjs）、admin の MCP（express・hono）
  dompurify: ^3.4.17
  mermaid: ^11.16.1
  prismjs: ^1.30.0
  qs: ^6.16.0
  body-parser: ^2.3.0
  "@hono/node-server": ^1.19.15
  "yaml@2": ^2.8.3
  "postcss-selector-parser@7": ^7.1.6
# 開発・CI だけで使うもの（テスト・ビルドの道具）
  "tar@7": ^7.5.21
  "undici@7": ^7.29.1
  "vite@7": ^7.3.7
  "brace-expansion@2": ^2.1.7
  "minimatch@9": ^9.0.7
  "picomatch@2": ^2.3.2
  "picomatch@4": ^4.0.4
  "rollup@4": ^4.59.0
  "flatted@3": ^3.4.2
