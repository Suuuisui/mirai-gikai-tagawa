  "@opentelemetry/sdk-node": ^0.217.0
  "@opentelemetry/exporter-prometheus": ^0.217.0
  "@opentelemetry/propagator-jaeger": ^2.9.0
  hono: ^4.12.34
  fast-uri: ^3.1.8
  ip-address: ^10.7.1
  proxy-addr: ^2.0.8
  lodash-es: ^4.18.0
  ws: ^8.21.0
  postcss: ^8.5.23
  nanoid@<4: ^3.3.18
